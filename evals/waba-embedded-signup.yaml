skill: waba-embedded-signup
cases:
  - query: "Walk me through connecting a customer's WhatsApp via Embedded Signup."
    expect: trigger
    rationale: Direct embedded-signup onboarding ask — canonical scope of this skill.
  - query: "Should this child profile inherit our organization WABA or receive dedicated waba_id credentials?"
    expect: trigger
    rationale: Direct decision between the two supported child-profile WABA paths.
  - query: "Is there a public Sent endpoint that starts organization Embedded Signup?"
    expect: trigger
    rationale: Hard API-boundary case; organization Embedded Signup starts in the dashboard, not a public endpoint.
  - query: "Help me implement Sign in with Google for my Next.js app."
    expect: no_trigger
    rationale: Generic OAuth / social sign-in, not Meta's Embedded Signup. No WhatsApp / WABA / Meta context.
  - query: "How do I complete the profile with webHookUrl and safely process its event callback?"
    expect: trigger
    rationale: Profile completion and its event-based callback are part of the end-to-end WABA onboarding flow.
